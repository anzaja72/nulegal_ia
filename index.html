    <style>
      :root { --sky:#38B6FF; --navy:#1E293B; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; background:var(--sky); color:var(--navy); font:500 17px/1.6 'Plus Jakarta Sans',system-ui,sans-serif; display:grid; place-items:center; padding:24px; }

      p { margin:0 0 32px; max-width:46ch; }
      ul { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
      a { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:18px 24px; background:#fff; color:var(--navy); text-decoration:none; border-radius:20px; font:600 1.15rem 'Space Grotesk',system-ui,sans-serif; transition:background .2s,color .2s; }
      a span { font:500 .92rem 'Plus Jakarta Sans',system-ui,sans-serif; opacity:.8; }
      a:hover { background:var(--navy); color:#fff; }
      a:focus-visible { outline:3px solid var(--navy); outline-offset:3px; }
      @media (max-width:520px){ a { flex-direction:column; gap:2px; } }
    </style>
